<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><title>Simulasi widget klasik</title></head>
<body>
  <!-- Struktur klasik Turnstile: label menutup input tersembunyi + marker terlihat -->
  <label class="ctp-checkbox-label" id="challenge-stage">
    <input type="checkbox" class="ctp-checkbox" tabindex="0" aria-checked="false" />
    <span class="marker"></span>
  </label>
  <span class="ctp-checkbox-text">Verify you are human</span>
</body>
</html>
